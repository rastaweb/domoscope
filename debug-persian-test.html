            <p class="has-text-align-right">ما در حیاطمان فانوس های‌ تزیینی داریم و ان ها ستارگان را دارند.</p>
            <p class="has-text-align-right"><a href="http://test.com" title="عنوان تستی"><img src="http://stage.api.mamiacollection.com/ftp/2025/10/13/mYeeGB8jej8BayBQFmJuI8I6zBt0MsbnvT599jUb.jpg" alt="متن آلت تصویر" width="768" height="432"></a></p>
            <p class="has-text-align-right">حیاط ما بـه دیوارهایش محدود می‌شود اما باغ آن ها بی انتهاست! با شنیدن حرفهای پسر، زبان مرد بند آمده بود. بعد پسر بچه اضافه کرد : متشکرم پدر، تو بـه من نشان دادی که ما چقدر فقیر هستیم.</p>
        </p>
    </div>
    <h3>man nistam</h3>
`;

            <p class="has-text-align-right"><a href="http://test.com" title="عنوان تستی"><img src="http://stage.api.mamiacollection.com/ftp/2025/10/13/mYeeGB8jej8BayBQFmJuI8I6zBt0MsbnvT599jUb.jpg" alt="متن آلت تصویر" width="768" height="432"></a></p>
            <p class="has-text-align-right">حیاط ما بـه دیوارهایش محدود می‌شود اما باغ آن ها بی انتهاست! با شنیدن حرفهای پسر، زبان مرد بند آمده بود. بعد پسر بچه اضافه کرد : متشکرم پدر، تو بـه من نشان دادی که ما چقدر فقیر هستیم.</p>
        </p>
    </div>
    <h3>man nistam</h3>
`;

      console.log('🔍 Starting debug analysis...');
      console.log('Only difference should be: <h1 class="h1-style"> → <h1>');

      try {
        const result = domoscope.getCustomDiffStats(oldHtml, newHtml);

        console.log('📊 Results:');
        console.log('Total Changed Tags:', result.stats.totalChangedTags, '(Expected: 1)');
        console.log('Full Stats:', result.stats);

        // Detailed analysis
        console.log('\n🔬 Detailed Analysis:');
        console.log('Tag Stats:', result.stats.tagStats);
        console.log('Changed Tags:', result.stats.changedTags);

        // Check the diff result elements
        console.log('\n🏗️ Diff Result Structure:');
        console.log('Root Elements Count:', result.diffResult.rootElements.length);

        result.diffResult.rootElements.forEach((el, i) => {
          console.log(`Element ${i}:`, el.tagName, el.className, el.getAttribute('class'));

          // Check for diff annotations
          const diffElements = el.querySelectorAll('[class*="diff-"]');
          console.log(`  Diff annotations found: ${diffElements.length}`);
          diffElements.forEach((diffEl, j) => {
            console.log(`    ${j}: ${diffEl.tagName}.${diffEl.className}`);
          });
        });

        // Display in page
        document.getElementById('results').innerHTML = `
                <h2>Results Analysis</h2>
                <p><strong>Total Changed Tags:</strong> ${result.stats.totalChangedTags} (Expected: 1)</p>
                <p><strong>Issue:</strong> ${result.stats.totalChangedTags === 1 ? '✅ CORRECT' : '❌ INCORRECT - Should be 1'}</p>
                
                <h3>Full Statistics:</h3>
                <pre>${JSON.stringify(result.stats, null, 2)}</pre>
                
                <h3>Expected Change:</h3>
                <p>Only the <code>&lt;h1&gt;</code> tag should be marked as changed (class attribute removed)</p>
            `;
      } catch (error) {
        console.error('❌ Error during analysis:', error);
        document.getElementById('results').innerHTML =
          `<p style="color: red;">Error: ${error.message}</p>`;
      }
    </script>
  </body>
