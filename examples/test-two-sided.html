<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Two-Sided Diff</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .container {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      .side {
        flex: 1;
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 8px;
        min-height: 200px;
      }

      .old-side {
        background-color: #fff5f5;
        border-color: #ef4444;
      }

      .new-side {
        background-color: #f0fdf4;
        border-color: #22c55e;
      }

      .header {
        font-weight: bold;
        margin-bottom: 10px;
        padding: 8px;
        border-radius: 4px;
        color: white;
      }

      .old-header {
        background-color: #ef4444;
      }

      .new-header {
        background-color: #22c55e;
      }

      /* Diff highlighting styles */
      .diff-added {
        background-color: #22c55e !important;
        color: white !important;
        padding: 2px 4px;
        border-radius: 3px;
      }

      .diff-removed {
        background-color: #ef4444 !important;
        color: white !important;
        text-decoration: line-through;
        padding: 2px 4px;
        border-radius: 3px;
      }

      .diff-attr-changed {
        outline: 2px solid #3b82f6 !important;
        outline-offset: 1px;
      }

      .diff-element-changed {
        border: 2px dashed #f59e0b !important;
        padding: 2px;
      }

      textarea {
        width: 100%;
        height: 150px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
      }

      button {
        padding: 10px 20px;
        background-color: #3b82f6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background-color: #2563eb;
      }

      .stats {
        background-color: #f3f4f6;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .debug {
        background-color: #fef3c7;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h1>Two-Sided Diff Test</h1>

    <div>
      <h3>Old Content</h3>
      <textarea id="oldContent">
<h1>man title hastam</h1>
<p>lorem ipsum oblador amet dide.</p>
<p>man paragraph 2 hastam 
  <span>manam span hastam</span>
</p></textarea
      >
    </div>

    <div>
      <h3>New Content</h3>
      <textarea id="newContent">
<h1>man updated title hastam</h1>
<p>lorem ipsum oblador amet dide with more content.</p>
<p>man paragraph 2 hastam 
  <span class="highlight">manam span hastam</span>
</p>
<div>new added div element</div></textarea
      >
    </div>

    <button onclick="runDiff()">Generate Diff</button>

    <div id="stats" class="stats" style="display: none"></div>
    <div id="debug" class="debug" style="display: none"></div>

    <div class="container">
      <div class="side old-side">
        <div class="header old-header">Old Content (Only Removed Highlights)</div>
        <div id="oldRender"></div>
      </div>
      <div class="side new-side">
        <div class="header new-header">New Content (Added & Changed Only)</div>
        <div id="newRender"></div>
      </div>
    </div>

    <script type="module">
      import { getCustomDiffStats } from '../dist/index.js';

      window.runDiff = function () {
        const oldContent = document.getElementById('oldContent').value.trim();
        const newContent = document.getElementById('newContent').value.trim();

        console.log('=== RUNNING DIFF ===');
        console.log('Old content:', oldContent);
        console.log('New content:', newContent);

        // Generate diff
        const { diffResult, stats } = getCustomDiffStats(oldContent, newContent, {
          trackedTags: ['*'],
          watchedTags: ['*'],
          addedClass: 'diff-added',
          removedClass: 'diff-removed',
          attributeChangeClass: 'diff-attr-changed',
          elementChangeClass: 'diff-element-changed',
          wrapperTag: 'span',
          textWrapperTag: 'span',
          ignoreWhitespaceTexts: true,
        });

        console.log('=== DIFF RESULTS ===');
        console.log('Old root elements count:', diffResult.oldRootElements.length);
        console.log('New root elements count:', diffResult.newRootElements.length);
        console.log('Total root elements count:', diffResult.rootElements.length);
        console.log('All elements count:', diffResult.allElements.length);
        console.log('Stats:', stats);

        // NEW: Use the separated old and new root elements directly
        const oldElements = diffResult.oldRootElements;
        const newElements = diffResult.newRootElements;

        // Enhanced debug info
        document.getElementById('debug').style.display = 'block';
        document.getElementById('debug').innerHTML = `
          <strong>Debug Info:</strong><br>
          Old Root Elements: ${oldElements.length}<br>
          New Root Elements: ${newElements.length}<br>
          Total Root Elements: ${diffResult.rootElements.length}<br>
          <br>
          <strong>Old Content Root Elements:</strong><br>
          ${oldElements
            .map((el, i) => `${i}: ${el.tagName} - ${el.outerHTML.substring(0, 50)}...`)
            .join('<br>')}
          <br><br>
          <strong>New Content Root Elements:</strong><br>
          ${newElements
            .map((el, i) => `${i}: ${el.tagName} - ${el.outerHTML.substring(0, 50)}...`)
            .join('<br>')}
        `;

        console.log('=== ELEMENT SPLIT ===');
        console.log('Old elements:', oldElements.length);
        console.log('New elements:', newElements.length);

        // Render old content (only removed highlights)
        const oldRender = document.getElementById('oldRender');
        oldRender.innerHTML = '';

        oldElements.forEach((element) => {
          const cloned = element.cloneNode(true);
          oldRender.appendChild(cloned);
        });

        // Hide added content and attribute changes on left side
        oldRender.querySelectorAll('.diff-added').forEach((el) => {
          el.style.display = 'none';
        });
        oldRender.querySelectorAll('.diff-attr-changed').forEach((el) => {
          el.classList.remove('diff-attr-changed');
        });
        oldRender.querySelectorAll('.diff-element-changed').forEach((el) => {
          el.classList.remove('diff-element-changed');
        });

        // Render new content (only added/changed highlights)
        const newRender = document.getElementById('newRender');
        newRender.innerHTML = '';

        newElements.forEach((element) => {
          const cloned = element.cloneNode(true);
          newRender.appendChild(cloned);
        });

        // Hide removed content on right side
        newRender.querySelectorAll('.diff-removed').forEach((el) => {
          el.style.display = 'none';
        });

        // Show stats
        document.getElementById('stats').style.display = 'block';
        document.getElementById('stats').innerHTML = `
          <strong>Statistics:</strong><br>
          Changed Tags: ${stats.totalChangedTags}<br>
          Added Tags: ${stats.totalAddedTags}<br>
          Removed Tags: ${stats.totalRemovedTags}<br>
          Added Words: ${stats.totalAddedWords}<br>
          Removed Words: ${stats.totalRemovedWords}<br>
        `;
      };

      // Auto-run on load
      setTimeout(() => window.runDiff(), 100);
    </script>
  </body>
</html>
